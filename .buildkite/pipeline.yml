steps:
  - label: ":package: Build .deb"
    command: "bash packaging/build-deb.sh"
    artifact_paths:
      - "masterops_*.deb"
    agents:
      queue: "masterops"

  - wait

  - label: ":rocket: Upload to Package Registry"
    command: "bash packaging/upload-package.sh"
    agents:
      queue: "masterops"
